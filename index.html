<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avatar Client Redirect</title>
  <meta http-equiv="refresh" content="0; url=./standalone_avatar_client.html">
  <script>
    const targetUrl = new URL("./standalone_avatar_client.html", window.location.href);
    if (window.location.search) {
      targetUrl.search = window.location.search;
    }
    if (window.location.hash) {
      targetUrl.hash = window.location.hash;
    }
    window.location.replace(targetUrl.toString());
  </script>
</head>
<body>
  <p>Redirecting to <a href="./standalone_avatar_client.html">standalone_avatar_client.html</a>.</p>
</body>
</html>
